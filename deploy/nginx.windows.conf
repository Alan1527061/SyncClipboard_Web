worker_processes 1;
error_log .runtime/error.log warn;
pid .runtime/nginx.pid;
events {
    worker_connections 512;
}
http {
    include ../.runtime/nginx-1.30.6/conf/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 0;
    client_body_temp_path .runtime/client_temp;
    proxy_temp_path .runtime/proxy_temp;
    fastcgi_temp_path .runtime/fastcgi_temp;
    uwsgi_temp_path .runtime/uwsgi_temp;
    scgi_temp_path .runtime/scgi_temp;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    server {
        listen 0.0.0.0:5034;
        server_name _;
        root html;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        location = / {
            error_page 418 = @scb_backend;
            if ($request_method !~ ^(GET|HEAD)$) { return 418; }
            try_files /index.html =404;
            add_header Cache-Control "no-cache";
        }
        location = /index.html {
            add_header Cache-Control "no-cache";
        }
        location = /app.js {
            add_header Cache-Control "no-cache";
        }
        location /assets/ {
            add_header Cache-Control "no-cache";
        }
        location / {
            proxy_pass http://127.0.0.1:5033;
            proxy_hide_header WWW-Authenticate;
        }
        location @scb_backend {
            proxy_pass http://127.0.0.1:5033;
        }
    }
}
