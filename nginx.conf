# 剪贴板网页端 —— 前端静态页 + API 反向代理
# 同源设计：网页和 API 都从这个端口出去，浏览器不需要处理跨域(CORS)
# 容器使用 host 网络，因此 127.0.0.1:5033 就是宿主机上的 SyncClipboard 服务
worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 512;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log off;
    sendfile   on;
    keepalive_timeout 65;

    # 手机原图可能很大，不设限制（SyncClipboard 服务端自己做校验）
    client_max_body_size 0;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 5034;
        server_name _;

        # ---------- 网页本体：直接在根路径上 ----------
        # https://域名:15034/ 打开就是网页，它的资源（app.js 等）也在根路径上 —— 没有 /web/ 这一层了。
        # 根路径上的 GET / 在服务端只回一句 "Server is running."，用不到，所以让出来没问题；
        # Windows 客户端走的是 15034，不受影响。
        #
        # ⚠️ 这里**故意不用 `try_files` 兜底**：那样任何带请求体的请求（你手机上传的大图）
        #    都会先被 nginx 读进临时文件缓冲一遍，而下面 location / 是直通 SyncClipboard 的、
        #    特意配了 `proxy_request_buffering off` 不落盘。所以静态文件按**精确路径**逐条列出：
        #    **以后往 html/ 里加新文件，记得在这里补一条 location**，否则会被当成 API 路径转走（404）。
        root  /usr/share/nginx/html;
        index index.html;

        # 根路径：
        #   · GET / HEAD  → 网页 index.html（用 try_files 指到具体文件，避开"目录+index"和 alias 的坑）
        #   · 其它方法    → 内部跳到 @scb_backend（WebDAV 分支，见文件末尾）
        #
        # ⚠️⚠️ 为什么必须有这个 WebDAV 分支（2026-09-22 修，别删）：
        #    Windows 客户端的「服务器类型」选的是 **WebDAV**，它一连上就对**根路径**发
        #    `PROPFIND /`（Depth: 1）探测目录。nginx 的静态模块只认 GET/HEAD/POST，别的动词一律回
        #    **405 Not Allowed** —— 客户端界面就报 405 连不上。
        #    15033 直连 5033 的时代没有这层 nginx，所以这是收口到 clipweb 之后才引入的**回归**；
        #    后端自己对 `PROPFIND /` 是回 200 的（它的 Allow 就是 `GET, PROPFIND`，专为这个留的）。
        #
        #    ⚠️ 写法有讲究：**不能**用 `limit_except GET HEAD { proxy_pass ... }` —— nginx 只允许
        #       在 limit_except 里放 proxy_pass 一个指令，再放 proxy_http_version / proxy_set_header
        #       之类就直接 "directive is not allowed here" 起不来。所以用 error_page 内部跳转。
        location = / {
            error_page 418 = @scb_backend;
            if ($request_method !~ ^(GET|HEAD)$) { return 418; }
            try_files /index.html =404;
        }
        location = /index.html {
            add_header Cache-Control "no-cache";
        }
        location = /app.js {
            add_header Cache-Control "no-cache";
        }
        # 以后图片/CSS 之类的丢进 html/assets/ 就行，这条已经留好了
        location /assets/ {
            add_header Cache-Control "no-cache";
        }
        # 开发自检用的两个（无头浏览器截图那套），不影响正常使用
        location = /seed.html { }
        location /dev/        { }

        # ---------- 其余全部转发给 SyncClipboard ----------
        location / {
            proxy_pass http://127.0.0.1:5033;
            proxy_http_version 1.1;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # ⚠️ 把服务端的 "Basic 认证挑战" 抹掉，别让浏览器看见。
            # 没带账号时服务端回的是 401 + `WWW-Authenticate: Basic realm="SyncClipboard"`，
            # 浏览器一看到这个响应头就会弹**自家**的账号密码框 —— 于是新设备上会连着被问两次：
            # ① 页面还没存账号时那次自动轮询（请求里没有 Authorization）→ 浏览器弹框
            # ② 网页自己的设置弹窗（新设备 localStorage 里没账号）
            # 抹掉之后只剩网页自己那个弹窗，账号在网页里填一次就行。
            # （网页是自己往请求头里加 Authorization 的，不受影响；15034 那条给 Windows 客户端的不动。）
            proxy_hide_header WWW-Authenticate;
            # SignalR (实时推送) 需要长连接
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # 大文件上传/下载不缓冲，直接流式转发
            proxy_request_buffering off;
            proxy_buffering         off;
            proxy_read_timeout      300s;
            proxy_send_timeout      300s;
        }

        # ---------- 根路径上的非 GET/HEAD（WebDAV 的 PROPFIND 等）----------
        # 只被上面 `location = /` 的 `error_page 418` 内部跳到，外部访问不到这个路径。
        # 内容和 `location /` 那份基本一样（nginx 没有"包含片段"的写法，只能各写一份，
        # ⚠️ 以后改下面 location / 的转发参数时，记得这两处一起改）。
        # 唯一的**故意**差别：这里不抹 `WWW-Authenticate` —— 桌面客户端靠 401 挑战头决定
        # 要不要补发账号密码，抹了可能就卡在 401；抹挑战头那条是给浏览器看的。
        location @scb_backend {
            proxy_pass http://127.0.0.1:5033;
            proxy_http_version 1.1;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_request_buffering off;
            proxy_buffering         off;
            proxy_read_timeout      300s;
            proxy_send_timeout      300s;
        }
    }
}
